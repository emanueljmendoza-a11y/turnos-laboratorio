{% extends 'base.html' %}
{% block contenido %}
<div class="encabezado"><div><span class="sobretitulo">CIRCULACIÓN</span><h1>Registrar préstamo</h1><p>Se asigna un plazo de 14 días. Una reserva lista puede convertirse en préstamo.</p></div><a class="boton secundario" href="{{ url_for('prestamos') }}">← Volver</a></div>
<section class="panel panel-formulario"><form method="post"><input type="hidden" name="_csrf" value="{{ token_csrf() }}"><div class="form-grid"><label class="campo">Usuario<select name="usuario_id" required><option value="" {{ 'selected' if not seleccionado_usuario else '' }} disabled>Selecciona un lector</option>{% for u in usuarios %}<option value="{{ u.id }}" {{ 'selected' if seleccionado_usuario == u.id else '' }}>{{ u.nombre }} ({{ u.activos }}/3 préstamos)</option>{% endfor %}</select></label><label class="campo">Libro<select name="libro_id" required><option value="" disabled {{ 'selected' if not seleccionado else '' }}>Selecciona un libro</option>{% for l in libros %}<option value="{{ l.id }}" {{ 'selected' if seleccionado == l.id else '' }}>{{ l.titulo }} · {{ l.disponibles }} libres</option>{% endfor %}</select></label></div><div class="aviso informacion">Un libro sin ejemplares libres solo puede prestarse al usuario que tenga una reserva en estado «lista».</div><div class="acciones-form"><a class="boton secundario" href="{{ url_for('prestamos') }}">Cancelar</a><button class="boton primario" type="submit">Confirmar préstamo</button></div></form></section>
{% endblock %}
